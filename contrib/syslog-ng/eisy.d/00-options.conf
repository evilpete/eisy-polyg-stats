#############################################################################
# 00-options.conf -- global options and site-specific values
#
# Everything an installation normally needs to change lives in the
# @define statements below.
#############################################################################

# --- remote syslog server ------------------------------------------------
@define remote_host   "loghost.example.net"
@define remote_port   "601"          # 601 = syslog over TCP (RFC5424/RFC6587)
                                     # 514 = legacy BSD syslog

# --- where the logs live -------------------------------------------------
# IoX writes its own logs under /var/isy/FILES/LOG on eisy / Polisy.
@define iox_log_dir   "/var/isy/FILES/LOG"
# The Z-Wave / Zigbee / Matter daemons log into /var/log (rotated by newsyslog).
@define zx_log_dir    "/var/log"
# Polyglot v3 itself.
@define pg3_log_dir   "/var/polyglot/logs"
# Polyglot v3 plugin instances -- one log directory per node server.
@define pg3_ns_dir    "/var/polyglot/pg3/ns"

# --- timezone of the local log files -------------------------------------
# None of these files records a timezone, so a bare timestamp is read in the
# host's local time.  If the host clock is UTC but the daemons log local
# time (or the other way round), pin it here; the value is pasted verbatim
# into every date-parser() in this configuration.  Leave empty for "local".
@define tz            ""
# @define tz          "time-zone(\"America/Los_Angeles\")"

options {
    # Keep the timestamp that came out of the log file, at millisecond
    # resolution, and always send an explicit timezone offset so the
    # collector cannot re-interpret it.
    ts-format(iso);
    frac-digits(3);
    keep-timestamp(yes);

    chain-hostnames(no);
    keep-hostname(yes);
    use-fqdn(no);
    use-dns(no);
    dns-cache(no);

    time-reopen(10);
    flush-lines(100);
    mark-freq(0);

    create-dirs(yes);
};
