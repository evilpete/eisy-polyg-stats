#############################################################################
# 01-destinations.conf -- the remote log server
#
# syslog() speaks RFC5424, which is the only framing here that can carry
# a millisecond timestamp with a timezone offset plus structured data.
# The message the collector receives therefore holds the timestamp that
# was written in the local file, not the time syslog-ng read it.
#############################################################################

destination d_remote {
    syslog(
        "`remote_host`"
        transport("tcp")
        port(`remote_port`)

        # RFC5424 header: <pri>1 TIMESTAMP HOST APP PROCID MSGID [SD] MSG
        # ${ISODATE} is the date-parser() result, so the original
        # timestamp is what goes on the wire.
        ts-format(iso)
        frac-digits(3)

        # Survive a collector outage / WAN blip without losing messages.
        # mem-buf-length() (message count) is the in-memory knob for a
        # non-reliable buffer; mem-buf-size() applies to reliable(yes).
        # dir() must exist and be writable: /var/db/syslog-ng on FreeBSD,
        # /var/lib/syslog-ng on Linux.
        disk-buffer(
            mem-buf-length(20000)       # messages held in RAM
            disk-buf-size(67108864)     # 64 MiB spill file
            reliable(no)
            dir("/var/db/syslog-ng")
        )
        keep-alive(yes)
        so-keepalive(yes)
    );
};

