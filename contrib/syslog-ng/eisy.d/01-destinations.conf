# --- legacy BSD syslog variant ------------------------------------------
# Only if the collector cannot do RFC5424.  RFC3164 has no year, no
# sub-second field and no timezone, so a timestamp older than the current
# year arrives ambiguous; prefer syslog() above whenever possible.
#
# destination d_remote {
#     network("`remote_host`" transport("tcp") port(514) flags(syslog-protocol-off));
# };

# --- local copy (optional, handy while tuning the parsers) ---------------
destination d_local_parsed {
    file("/var/log/eisy-forwarded.log"
         template("${ISODATE} ${HOST} ${FACILITY}.${LEVEL} ${PROGRAM}: ${MESSAGE}\n")
    );
};
