#############################################################################
# 02-common.conf -- filters, rewrites and parser blocks shared by the
#                   per-log configurations that follow.
#############################################################################

# Blank lines and lines that are only whitespace.  IoX writes a bare CR
# before every ERROR.LOG record, which arrives as an empty message.
filter f_blank { message("^[[:space:]]*$"); };

# IoX log files are CRLF terminated.  Strip the stray CR before anything
# else looks at the message, otherwise it ends up inside the last parsed
# column and then on the wire.
rewrite r_strip_cr {
    subst("\r", "", value("MESSAGE"), flags("global"));
};

#---------------------------------------------------------------------------
# Z-Wave / Zigbee / Matter daemon format (ZWAY.LOG, ZBEE.LOG, ZMAT.LOG)
#
#   [2026-09-13 23:14:04.003] [I] [iox] ml_sensor_val: sending status: ...
#   [2026-09-13 23:15:39.253] [D] [...] SETDATA devices.18117...
#
#   .zx.ts   timestamp, millisecond resolution
#   .zx.lvl  single letter level: D debug, I info, W warning, E error
#   .zx.mod  emitting module ("iox", "chip", "..." for the serial layer)
#   .zx.msg  the text
#---------------------------------------------------------------------------
block parser zx_parse() {
    regexp-parser(
        prefix(".zx.")
        template("${MESSAGE}")
        patterns('^\[(?<ts>[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]+)\] \[(?<lvl>[A-Z])\] \[(?<mod>[^\]]*)\][ ]?(?<msg>(?s:.*))$')
    );
};

block parser zx_date() {
    date-parser(format("%Y-%m-%d %H:%M:%S.%f") template("${.zx.ts}") `tz`);
};

block rewrite zx_severity() {
    set-severity("info");
    set-severity("debug",   condition(match("^D$" value(".zx.lvl"))));
    set-severity("info",    condition(match("^I$" value(".zx.lvl"))));
    set-severity("warning", condition(match("^W$" value(".zx.lvl"))));
    set-severity("err",     condition(match("^E$" value(".zx.lvl"))));
    set-severity("crit",    condition(match("^[CF]$" value(".zx.lvl"))));
};

# Reformat to "[module] text" and hand the parsed fields to the collector
# as RFC5424 structured data.  32473 is the IANA example enterprise number;
# replace it with your own if you have one registered.
block rewrite zx_format() {
    set("[${.zx.mod}] ${.zx.msg}", value("MESSAGE"));
    set("${.zx.lvl}",  value(".SDATA.eisy@32473.lvl"));
    set("${.zx.mod}",  value(".SDATA.eisy@32473.module"));
};

# Everything that fails its parser still has to reach the collector -- it is
# the unparsed lines that usually matter.  Each per-log file routes them
# here with flags(fallback) on a final log path.
rewrite r_mark_unparsed {
    set("unparsed", value(".SDATA.eisy@32473.parse"));
};

#---------------------------------------------------------------------------
# Optional volume controls
#
# The serial traces in ZWAY.LOG and ZBEE.LOG are most of the byte volume on
# a busy system.  Add  filter(f_no_debug);  to a log path (right after the
# junction) to keep the [D] records off the wire, or use the rate limit to
# cap a chatty source without losing it entirely.
#---------------------------------------------------------------------------
filter f_no_debug { level(info..emerg); };

