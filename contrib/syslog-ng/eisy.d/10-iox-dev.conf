#############################################################################
# DEV.LOG -- IoX device status log            facility local0 / iox-dev
#
# Tab separated, CRLF terminated, six columns:
#
#   ZB55147_001_1<TAB>CLITEMP<TAB>62.17°F<TAB>Sun 2026/09/13 23:13:16 <TAB>0<TAB>5
#   node           driver     value          timestamp                 flag level
#############################################################################

source s_iox_dev {
    file("`iox_log_dir`/DEV.LOG"
        flags(no-parse)
        program-override("iox-dev")
        follow-freq(1)
        persist-name("eisy-iox-dev")
    );
};

parser p_iox_dev {
    csv-parser(
        prefix(".dev.")
        columns("node", "driver", "value", "ts", "flag", "level")
        delimiters(chars("	"))
        flags(strip-whitespace, drop-invalid)
        template("${MESSAGE}")
    );
    # "Sun 2026/09/13 23:13:16" -- the timestamp the device event carries.
    date-parser(format("%a %Y/%m/%d %H:%M:%S") template("${.dev.ts}") `tz`);
};

rewrite r_iox_dev {
    set-facility("local0");
    set-severity("info");
    set("${.dev.node} ${.dev.driver}=${.dev.value}", value("MESSAGE"));
    set("${.dev.node}",   value(".SDATA.eisy@32473.node"));
    set("${.dev.driver}", value(".SDATA.eisy@32473.driver"));
    set("${.dev.value}",  value(".SDATA.eisy@32473.value"));
};

log {
    source(s_iox_dev);
    rewrite(r_strip_cr);
    filter { not filter(f_blank); };
    junction {
        channel { parser(p_iox_dev); rewrite(r_iox_dev); flags(final); };
        channel { rewrite(r_mark_unparsed); flags(fallback); };
    };
    destination(d_remote);
    flags(flow-control);
};
