#############################################################################
# ERROR.LOG -- IoX error log                  facility local1 / iox-error
#
# Tab separated, four columns, each record preceded by a bare CR:
#
#   Sun 2026/09/13 03:37:32 <TAB>0<TAB>-170001<TAB><s:Envelope>...
#   timestamp                    flag  code      text
#############################################################################

source s_iox_error {
    file("`iox_log_dir`/ERROR.LOG"
        flags(no-parse)
        program-override("iox-error")
        follow-freq(1)
        persist-name("eisy-iox-error")
    );
};

parser p_iox_error {
    csv-parser(
        prefix(".err.")
        columns("ts", "flag", "code", "text")
        delimiters(chars("	"))
        flags(strip-whitespace, drop-invalid, greedy)
        template("${MESSAGE}")
    );
    date-parser(format("%a %Y/%m/%d %H:%M:%S") template("${.err.ts}") `tz`);
};

rewrite r_iox_error {
    set-facility("local1");
    set-severity("err");
    set("[${.err.code}] ${.err.text}", value("MESSAGE"));
    set("${.err.code}", value(".SDATA.eisy@32473.code"));
};

log {
    source(s_iox_error);
    rewrite(r_strip_cr);
    filter { not filter(f_blank); };
    junction {
        channel { parser(p_iox_error); rewrite(r_iox_error); flags(final); };
        channel { rewrite(r_mark_unparsed); flags(fallback); };
    };
    destination(d_remote);
    flags(flow-control);
};
