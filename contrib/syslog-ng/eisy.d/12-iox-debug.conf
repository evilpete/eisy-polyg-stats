#############################################################################
# debug.log -- IoX / UDShell debug log        facility local5 / iox-debug
#
#   2026-09-13 23:15:16 -  DBG1|ISY   [T:38202914838536]  [B  n008_stats] POST - GV4 896 (UDShell.h@155:_debug())
#   2026-09-13 23:16:00 -  DBG3|      [T:38202914775048] topic = spolisy/upgrade (UDXComm.cpp@425:on_message())
#
# The subsystem column ("ISY") is empty on some records, and the trailing
# "(file@line:function())" is kept as part of the text.
#############################################################################

source s_iox_debug {
    file("`iox_log_dir`/debug.log"
        flags(no-parse)
        program-override("iox-debug")
        follow-freq(1)
        persist-name("eisy-iox-debug")
        # A record starts with a date; anything else belongs to the record
        # above it (stack traces, wrapped XML).
        multi-line-mode(regexp)
        multi-line-prefix("^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2} ")
        # flush a record that has no successor yet, instead of holding it
        # until the next line is written
        multi-line-timeout(2)
    );
};

parser p_iox_debug {
    regexp-parser(
        prefix(".dbg.")
        template("${MESSAGE}")
        patterns('^(?<ts>[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}) -[ ]+(?<lvl>[A-Z]+[0-9]*)\|(?<subsys>\S*)[ ]+\[T:(?<thread>[0-9]+)\][ ]+(?<msg>(?s:.*))$')
    );
    date-parser(format("%Y-%m-%d %H:%M:%S") template("${.dbg.ts}") `tz`);
};

rewrite r_iox_debug {
    set-facility("local5");
    set-severity("debug");
    set-severity("info",    condition(match("^INFO"  value(".dbg.lvl"))));
    set-severity("notice",  condition(match("^NOTE"  value(".dbg.lvl"))));
    set-severity("warning", condition(match("^WARN"  value(".dbg.lvl"))));
    set-severity("err",     condition(match("^ERR"   value(".dbg.lvl"))));
    set-severity("crit",    condition(match("^(CRIT|FATAL)" value(".dbg.lvl"))));
    set("${.dbg.msg}", value("MESSAGE"));
    set("${.dbg.lvl}",    value(".SDATA.eisy@32473.lvl"));
    set("${.dbg.subsys}", value(".SDATA.eisy@32473.subsys"));
    set("${.dbg.thread}", value(".SDATA.eisy@32473.thread"));
};

log {
    source(s_iox_debug);
    rewrite(r_strip_cr);
    filter { not filter(f_blank); };
    junction {
        channel { parser(p_iox_debug); rewrite(r_iox_debug); flags(final); };
        channel { rewrite(r_mark_unparsed); flags(fallback); };
    };
    destination(d_remote);
    flags(flow-control);
};
