#############################################################################
# ZWAY.LOG -- Z-Wave (Z-Way) daemon           facility local2 / zway
#
#   [2026-09-13 23:14:04.003] [I] [iox] ml_sensor_val: sending status: ...
#   [2026-09-13 23:14:04.053] [D] [...] RECEIVED: ( 01 10 00 04 ... )
#############################################################################

source s_zway {
    file("`zx_log_dir`/ZWAY.LOG"
        flags(no-parse)
        program-override("zway")
        follow-freq(1)
        persist-name("eisy-zway")
        multi-line-mode(regexp)
        multi-line-prefix("^\\[[0-9]{4}-[0-9]{2}-[0-9]{2} ")
        # flush a record that has no successor yet, instead of holding it
        # until the next line is written
        multi-line-timeout(2)
    );
};

parser p_zway    { zx_parse(); zx_date(); };
rewrite r_zway   { set-facility("local2"); zx_severity(); zx_format(); };

log {
    source(s_zway);
    rewrite(r_strip_cr);
    filter { not filter(f_blank); };
    junction {
        channel { parser(p_zway); rewrite(r_zway); flags(final); };
        channel { rewrite(r_mark_unparsed); flags(fallback); };
    };
    destination(d_remote);
    flags(flow-control);
};
