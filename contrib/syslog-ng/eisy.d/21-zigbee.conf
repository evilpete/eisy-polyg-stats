#############################################################################
# ZBEE.LOG -- Zigbee daemon                   facility local3 / zbee
#
#   [2026-09-13 23:15:39.253] [I] [iox] [ZB18117_001_125 ] Update Status - uom=78 prec=0 val=0 [GV5] [0]
#   [2026-09-13 23:15:43.177] [D] [...] Send Message: ( zero-length buffer )
#############################################################################

source s_zbee {
    file("`zx_log_dir`/ZBEE.LOG"
        flags(no-parse)
        program-override("zbee")
        follow-freq(1)
        persist-name("eisy-zbee")
        multi-line-mode(regexp)
        multi-line-prefix("^\\[[0-9]{4}-[0-9]{2}-[0-9]{2} ")
        # flush a record that has no successor yet, instead of holding it
        # until the next line is written
        multi-line-timeout(2)
    );
};

parser p_zbee    { zx_parse(); zx_date(); };
rewrite r_zbee   { set-facility("local3"); zx_severity(); zx_format(); };

log {
    source(s_zbee);
    rewrite(r_strip_cr);
    filter { not filter(f_blank); };
    junction {
        channel { parser(p_zbee); rewrite(r_zbee); flags(final); };
        channel { rewrite(r_mark_unparsed); flags(fallback); };
    };
    destination(d_remote);
    flags(flow-control);
};
