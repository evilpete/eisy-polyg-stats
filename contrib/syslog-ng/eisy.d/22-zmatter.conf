#############################################################################
# ZMAT.LOG -- Matter (Z-Matter) daemon        facility local4 / zmatter
#
#   [2026-01-21 20:41:09.470] [I] [iox] IoX Shutdown: Disconnecting from Matter
#   [2026-01-21 20:41:09.475] [E] [chip] [DL] System Layer shutdown
#
# Note the [chip] module: the Matter SDK logs through the same wrapper, so
# the same parser handles both.
#############################################################################

source s_zmatter {
    file("`zx_log_dir`/ZMAT.LOG"
        flags(no-parse)
        program-override("zmatter")
        follow-freq(1)
        persist-name("eisy-zmatter")
        multi-line-mode(regexp)
        multi-line-prefix("^\\[[0-9]{4}-[0-9]{2}-[0-9]{2} ")
        # flush a record that has no successor yet, instead of holding it
        # until the next line is written
        multi-line-timeout(2)
    );
};

parser p_zmatter  { zx_parse(); zx_date(); };
rewrite r_zmatter { set-facility("local4"); zx_severity(); zx_format(); };

log {
    source(s_zmatter);
    rewrite(r_strip_cr);
    filter { not filter(f_blank); };
    junction {
        channel { parser(p_zmatter); rewrite(r_zmatter); flags(final); };
        channel { rewrite(r_mark_unparsed); flags(fallback); };
    };
    destination(d_remote);
    flags(flow-control);
};
