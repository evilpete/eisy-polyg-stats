#############################################################################
# ZBEE.ARCHIVE.LOG -- newsyslog rotation notices   facility local3 / zbee-archive
#
#   Sep 13 16:00:00 eisy newsyslog[1733]: logfile turned over due to size>20000K
#
# This one is already RFC3164 syslog, so it is fed to syslog-ng's own syslog
# parser instead of a custom one: the file's timestamp, host, program and
# pid become the forwarded message's header verbatim.  RFC3164 carries no
# year, so syslog-ng fills in the current one.
#############################################################################

source s_zbee_archive {
    file("`zx_log_dir`/ZBEE.ARCHIVE.LOG"
        follow-freq(1)
        persist-name("eisy-zbee-archive")
    );
};

rewrite r_zbee_archive {
    set-facility("local3");
};

log {
    source(s_zbee_archive);
    rewrite(r_strip_cr);
    filter { not filter(f_blank); };
    rewrite(r_zbee_archive);
    destination(d_remote);
    flags(flow-control);
};
