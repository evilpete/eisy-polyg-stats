#############################################################################
# pg3-current.log -- Polyglot v3 daemon       facility local6 / pg3
#
#   2026-09-13 01:01:07.464 [pg3] error: HTTP 401 - OK with Reason code: 1001.
#   2026-09-13 22:27:17.185 [pg3] error: IoX Response body: <?xml ...
#
# Some records are very long (the plugin store JSON is a single line of
# several kilobytes), so log-msg-size() is raised for this source.
#############################################################################

source s_pg3 {
    file("`pg3_log_dir`/pg3-current.log"
        flags(no-parse)
        program-override("pg3")
        follow-freq(1)
        persist-name("eisy-pg3")
        log-msg-size(262144)
        multi-line-mode(regexp)
        multi-line-prefix("^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]+ ")
        # flush a record that has no successor yet, instead of holding it
        # until the next line is written
        multi-line-timeout(2)
    );
};

parser p_pg3 {
    regexp-parser(
        prefix(".pg3.")
        template("${MESSAGE}")
        patterns('^(?<ts>[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]+) \[(?<comp>[^\]]+)\] (?<lvl>[a-zA-Z]+): (?<msg>(?s:.*))$')
    );
    date-parser(format("%Y-%m-%d %H:%M:%S.%f") template("${.pg3.ts}") `tz`);
};

rewrite r_pg3 {
    set-facility("local6");
    set-severity("info");
    set-severity("debug",   condition(match("^(debug|trace)$" value(".pg3.lvl") flags(ignore-case))));
    set-severity("info",    condition(match("^info$"          value(".pg3.lvl") flags(ignore-case))));
    set-severity("warning", condition(match("^warn"           value(".pg3.lvl") flags(ignore-case))));
    set-severity("err",     condition(match("^err"            value(".pg3.lvl") flags(ignore-case))));
    set-severity("crit",    condition(match("^(crit|fatal)"   value(".pg3.lvl") flags(ignore-case))));
    set("[${.pg3.comp}] ${.pg3.msg}", value("MESSAGE"));
    set("${.pg3.comp}", value(".SDATA.eisy@32473.component"));
    set("${.pg3.lvl}",  value(".SDATA.eisy@32473.lvl"));
};

log {
    source(s_pg3);
    rewrite(r_strip_cr);
    filter { not filter(f_blank); };
    junction {
        channel { parser(p_pg3); rewrite(r_pg3); flags(final); };
        channel { rewrite(r_mark_unparsed); flags(fallback); };
    };
    destination(d_remote);
    flags(flow-control);
};
