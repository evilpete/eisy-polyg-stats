#############################################################################
# plugin.log -- Polyglot v3 node server (plugin) logs
#                                             facility local7 / pg3-plugin
#
#   2026-09-13 23:12:16.321 MQTT       udi_interface.interface INFO     interface:_message: Successfully set stats :: GV0 to 0.2 UOM 56
#   timestamp               thread     logger                  level    text
#
# This is Python logging output, so an exception is written as a traceback
# across many lines; multi-line-mode() keeps the whole traceback in one
# forwarded message.
#
# Every plugin instance has its own directory, so the source uses a
# wildcard and records which instance a line came from.
#############################################################################

source s_pg3_plugin {
    wildcard-file(
        base-dir("`pg3_ns_dir`")
        filename-pattern("*.log")
        recursive(yes)
        max-files(64)
        monitor-method("poll")
        flags(no-parse)
        program-override("pg3-plugin")
        follow-freq(1)
        persist-name("eisy-pg3-plugin")
        multi-line-mode(regexp)
        multi-line-prefix("^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]+ ")
        # flush a record that has no successor yet, instead of holding it
        # until the next line is written
        multi-line-timeout(2)
    );
};

parser p_pg3_plugin {
    regexp-parser(
        prefix(".plg.")
        template("${MESSAGE}")
        patterns('^(?<ts>[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]+) (?<thread>\S+)[ ]+(?<logger>\S+)[ ]+(?<lvl>[A-Z]+)[ ]+(?<msg>(?s:.*))$')
    );
    date-parser(format("%Y-%m-%d %H:%M:%S.%f") template("${.plg.ts}") `tz`);
};

rewrite r_pg3_plugin {
    set-facility("local7");
    set-severity("info");
    set-severity("debug",   condition(match("^DEBUG$"    value(".plg.lvl"))));
    set-severity("info",    condition(match("^INFO$"     value(".plg.lvl"))));
    set-severity("warning", condition(match("^WARN"      value(".plg.lvl"))));
    set-severity("err",     condition(match("^ERROR$"    value(".plg.lvl"))));
    set-severity("crit",    condition(match("^(CRITICAL|FATAL)$" value(".plg.lvl"))));
    set("${.plg.logger} ${.plg.msg}", value("MESSAGE"));
    set("${.plg.logger}", value(".SDATA.eisy@32473.logger"));
    set("${.plg.thread}", value(".SDATA.eisy@32473.thread"));
    set("${FILE_NAME}",   value(".SDATA.eisy@32473.file"));
};

log {
    source(s_pg3_plugin);
    rewrite(r_strip_cr);
    filter { not filter(f_blank); };
    junction {
        channel { parser(p_pg3_plugin); rewrite(r_pg3_plugin); flags(final); };
        channel { rewrite(r_mark_unparsed); flags(fallback); };
    };
    destination(d_remote);
    flags(flow-control);
};
