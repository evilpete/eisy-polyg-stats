#############################################################################
# syslog-ng configuration for an eisy / Polisy host
#
# Reads the local IoX, Z-Wave, Zigbee, Matter and Polyglot v3 log files,
# parses each format, preserves the timestamp written in the file and
# forwards everything to a remote syslog server.
#
# Install as /usr/local/etc/syslog-ng.conf (FreeBSD / eisy) or
# /etc/syslog-ng/syslog-ng.conf (Linux) and copy eisy.d/ next to it.
#############################################################################

@version: 4.2
@include "scl.conf"

# Where this file and eisy.d/ were installed.  A relative @include is
# resolved against syslog-ng's include path, not against this file, so the
# directory is spelled out.
#   FreeBSD / eisy : /usr/local/etc/syslog-ng
#   Linux          : /etc/syslog-ng
@define confdir "/usr/local/etc/syslog-ng"

# Per-log source, parser and log path definitions.  Files are read in
# alphabetical order, so 00-* (options), 01-* (destination) and 02-*
# (shared blocks) are parsed before the per-log files that use them.
@include "`confdir`/eisy.d/"
